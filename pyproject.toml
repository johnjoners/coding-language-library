[project]
name = "coding-language-library"
version = "0.3.0"
description = "Source-linked union of programming-language and tooling catalogues"
requires-python = ">=3.11"

[project.scripts]
coding-language-library = "mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "mcp/data"

[dependency-groups]
catalog = ["PyYAML==6.0.3"]
