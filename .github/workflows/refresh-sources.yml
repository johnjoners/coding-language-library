name: Refresh source snapshots

on:
  schedule:
    - cron: '17 15 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-refresh
  cancel-in-progress: false

jobs:
  check-and-propose:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install locked catalogue dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Check upstream revisions
        id: monitor
        run: python scripts/monitor_sources.py --github-output "$GITHUB_OUTPUT"
      - name: Rebuild and verify changed snapshots
        if: steps.monitor.outputs.changed == 'true'
        run: |
          python scripts/harvest_wikipedia.py
          python scripts/build_inventory.py
          python scripts/verify_inventory.py
          python -m unittest discover -s tests -v
      - name: Open or update review pull request
        if: steps.monitor.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git switch -C automated/source-refresh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit -m 'Refresh upstream language snapshots'
          git fetch origin automated/source-refresh:refs/remotes/origin/automated/source-refresh || true
          git push --force-with-lease origin automated/source-refresh
          if ! gh pr view automated/source-refresh --json number >/dev/null 2>&1; then
            gh pr create --base main --head automated/source-refresh \
              --title 'Refresh upstream language snapshots' \
              --body 'Review source revisions, catalogue changes, unresolved joins, and source terms before merging.'
          fi
